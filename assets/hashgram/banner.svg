<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Hashgram &#8212; a Layer-1 network with a fixed supply, end-to-end encrypted messaging, a signed social layer and no central point of control.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <radialGradient id="glow" cx="18%" cy="50%" r="55%"><stop offset="0" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" rx="24" fill="#000000"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="1199" height="339" rx="24" fill="none" stroke="#1a1a1a"/>

    <!-- chain of blocks, top right -->
    <g fill="none" stroke="#262626" stroke-width="1.5">
      <path d="M866 80 H1140"/>
    </g>
    <g fill="#0d0d0d" stroke="#404040" stroke-width="1.5">
      <rect x="848" y="62" width="36" height="36" rx="4"/>
      <rect x="932" y="62" width="36" height="36" rx="4"/>
      <rect x="1016" y="62" width="36" height="36" rx="4"/>
      <rect x="1100" y="62" width="36" height="36" rx="4"/>
    </g>
    <g fill="#ffffff">
      <rect x="858" y="72" width="16" height="16" rx="2"/>
      <rect x="942" y="72" width="16" height="16" rx="2"/>
      <rect x="1026" y="72" width="16" height="16" rx="2"/>
      <rect x="1110" y="72" width="16" height="16" rx="2"/>
    </g>
    <text x="1136" y="120" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#808080">BLOCK EVERY ~4 s</text>
    <text x="1136" y="296" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12.5" letter-spacing="1.5" fill="#808080">hashgram-1   &#183;   GENESIS e322bc23&#8230;5e4d</text>

    <!-- mark: pure white, on a solid black plate, per brand rules -->
    <rect x="64" y="70" width="200" height="200" rx="40" fill="#000000" stroke="#404040"/>
    <g transform="translate(96 102) scale(2.125)">
      <path fill="#ffffff" fill-rule="evenodd" d="M16 4h12v56H16zM36 4h12v56H36zM4 16h12v12H4zM28 16h8v12h-8zM48 16h12v12H48zM4 36h12v12H4zM28 36h8v12h-8zM48 36h12v12H48zM18 18h8v8h-8zM38 18h8v8h-8zM18 38h8v8h-8zM38 38h8v8h-8z"/>
    </g>

    <!-- pills -->
    <rect x="312" y="66" width="158" height="28" rx="14" fill="#0d0d0d" stroke="#404040"/>
    <text x="391" y="84.5" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" font-weight="600" letter-spacing="2" fill="#ffffff">OPEN PROJECT</text>
    <rect x="480" y="66" width="130" height="28" rx="14" fill="#0d0d0d" stroke="#404040"/>
    <text x="545" y="84.5" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" font-weight="600" letter-spacing="2" fill="#cfcfcf">APACHE-2.0</text>
    <rect x="620" y="66" width="124" height="28" rx="14" fill="#ffffff"/>
    <text x="682" y="84.5" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#000000">MAINNET LIVE</text>

    <!-- title -->
    <text x="312" y="168" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5" fill="#ffffff">hashgram</text>
    <rect x="312" y="186" width="48" height="2" fill="#ffffff"/>
    <text x="312" y="222" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#cfcfcf">A network that belongs to the people who run it.</text>
    <text x="312" y="250" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#808080">Fixed supply &#183; end-to-end encrypted messaging &#183; signed social layer &#183; no central point of control</text>
    <text x="312" y="296" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12.5" letter-spacing="1.5" fill="#808080">HASHGRAM.IO   &#183;   NOT A SERVICE   &#183;   MADE WITH LOVE</text>
  </g>
</svg>
